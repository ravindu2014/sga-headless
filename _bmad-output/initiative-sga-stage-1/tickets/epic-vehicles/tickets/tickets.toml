# Stories — epic-vehicles (build order)

[[entry]]
id = 1
type = "story"
title = "Static build catalogue and detail parity"
description = "Single build-time vehicle fetch; post-build verify that catalogue HTML includes all detail slugs."
covers = ["R2", "R12"]
risk = "medium"
hitl = false
verify = "npm run build with SANITY_USE_CDN unset; verify-static-vehicles passes; both catalogue and detail routes include new slugs after Sanity publish + rebuild deploy."

[[entry.acceptance]]
criterion = "Build fails if a vehicle detail page exists under out/en/vehicles/ but out/en/vehicles.html does not link to that slug."
covers = ["FR-62"]

[[entry.acceptance]]
criterion = "Catalogue and home featured use the same cached vehicle rows as generateStaticParams slug list (unstable_cache single snapshot per export)."
covers = ["FR-61", "FR-10"]

[[entry]]
id = 2
type = "story"
title = "Vehicle detail shows the photo beside the title, price, and enquiry"
description = "Move existing detail blocks to the Collecting Cars column positions. Do not change their sizes."
covers = ["R2"]
risk = "medium"
hitl = false
after = []
verify = "At 1440×900 the photo is left and the title, price, specifications, and enquiry are right, level with the photo. At 390×844 the photo is first. Sizes are unchanged."

[[entry.acceptance]]
criterion = "Desktop: left column is photo, gallery, description, features. Right column is badges, title, year · make · model, price, specifications, enquiry, starting level with the photo."
covers = ["R2"]

[[entry.acceptance]]
criterion = "Phone: photo and gallery, then the right-column stack, then description and features."
covers = ["R2"]

[[entry.acceptance]]
criterion = "Photo ratio, title size, specification cell padding, price size, and enquiry control sizes stay as they are. Empty specs stay omitted. The enquiry still says nothing is saved."
covers = ["R2"]

[[entry]]
id = 3
type = "story"
title = "Action labels are slightly smaller and price on request is outlined"
description = "Drop call-to-action labels by 2px. Outline “Price on request” on the card. Leave a rupee price at the current price size."
covers = ["R2", "R12"]
risk = "low"
hitl = false
after = []
verify = "At 1440 and 390 the action label is 14px inside a 44px button, and “Price on request” is a 14px outlined chip."

[[entry.acceptance]]
criterion = "Crimson and outlined action labels are 14px and semibold. The button stays 44px tall."
covers = ["R12"]

[[entry.acceptance]]
criterion = "“Price on request” on a card is a 14px outlined chip. A rupee price stays the current price size."
covers = ["R2"]

[[entry]]
id = 4
type = "story"
title = "Detail price on request matches the card and specifications sit tighter"
description = "Use the card’s price-on-request chip on the detail page, shrink the specification boxes with their type, and rule off the description with a thin line."
covers = ["R2", "R12"]
risk = "low"
hitl = false
after = []
verify = "At 1440 and 390 the detail chip matches the card, specification values are 14px in a shorter cell, and a description has a 1px line above it."

[[entry.acceptance]]
criterion = "Detail “Price on request” matches the card chip. A rupee price stays the current price size."
covers = ["R2"]

[[entry.acceptance]]
criterion = "Specification values are 14px. Cell padding is 10px by 4px. The label, border, and desktop two-column grid stay."
covers = ["R12"]

[[entry.acceptance]]
criterion = "A description or features list has a 1px standard line above it, with 16px of space on each side. A vehicle with neither has no line."
covers = ["R2"]