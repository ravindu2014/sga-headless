# Stories — epic-vehicles (build order)

[[entry]]
id = 1
type = "story"
title = "Static build catalogue and detail parity"
description = "Single build-time vehicle fetch; post-build verify that catalogue HTML includes all detail slugs."
covers = ["R2", "R12"]
risk = "medium"
hitl = false
verify = "npm run build with SANITY_USE_CDN unset; verify-static-vehicles passes; both catalogue and detail routes include new slugs after Sanity publish + rebuild deploy."

[[entry.acceptance]]
criterion = "Build fails if a vehicle detail page exists under out/en/vehicles/ but out/en/vehicles.html does not link to that slug."
covers = ["FR-62"]

[[entry.acceptance]]
criterion = "Catalogue and home featured use the same cached vehicle rows as generateStaticParams slug list (unstable_cache single snapshot per export)."
covers = ["FR-61", "FR-10"]

[[entry]]
id = 2
type = "story"
title = "Vehicle detail shows the photo beside the title, price, and enquiry"
description = "Move existing detail blocks to the Collecting Cars column positions. Do not change their sizes."
covers = ["R2"]
risk = "medium"
hitl = false
after = []
verify = "At 1440×900 the photo is left and the title, price, specifications, and enquiry are right, level with the photo. At 390×844 the photo is first. Sizes are unchanged."

[[entry.acceptance]]
criterion = "Desktop: left column is photo, gallery, description, features. Right column is badges, title, year · make · model, price, specifications, enquiry, starting level with the photo."
