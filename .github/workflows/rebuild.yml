# Manual or Sanity-triggered production build (AD-7). Deploy to Cloudflare is separate until owner approves.
name: Rebuild site

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note for the Actions log
        required: false
        type: string
  repository_dispatch:
    types: [sanity-publish]

concurrency:
  group: rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          SANITY_PROJECT_ID: n2zalqm8
          SANITY_DATASET: production

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-static-out
          path: out/
          if-no-files-found: error